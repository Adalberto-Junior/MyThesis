            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: auto;
            overflow-y: scroll;
            overflow: auto;
        }
        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 30%;

        }
        .container input[type="submit"] {

            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .container input[type="submit"]:hover {

        }
        .myDiv {
            border: 0px outset beige;
            background-color: lavender;    
            text-align: center;
            width: 99%;
            height: 40px;
            position: absolute;
            top: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
        }
        .mybutton {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .mybutton:hover {
            background-color: #45a049;
        }
        .hidden {
            display: none;
        }
        .form {
            width: 90%; /* Ajuste conforme necessário */
            height: auto; /* Permite que o formulário expanda conforme novos campos são adicionados */
            margin: 20px 0;
        }
      </style>

    <div class="myDiv">
        <h2>Adicionar Exercício</h2>
    </div>
    <div class="container">
        <form action="/" method="post" id="dynamicForm" class="form">
            <label for="name">Nome do Exercício:</label><br>
            <input type="text" id="name" name="name" required><br><br>

            <label for="description">Descrição:</label><br>
            <input type="text" id="description" name="description-exercise" required><br><br>

            <label for="userName">Nome do Utente:</label><br>
            <input type="text" id="userName" name="userName" required><br><br>

            <label for="tipo">Tipo:</label><br>
            <select id="tipo" name="tipo" onchange="showFields()">
                <option value="">Selecione...</option>
                <option value="palavras">Repetição de Palavras</option>
                <option value="frases">Repetição de Frases</option>
                <option value="leitura">Atividades de Leitura</option>
                <option value="discurso">Discurso Espontâneo</option>
                <option value="diadococinesia">Diadococinésia</option>
            </select>
            <br><br>

            <!-- Container dinâmico de campos -->
            <div id="stepsContainer" class="hidden">
                <h2>Passos:</h2>
                <div id="stepFields"></div>
                <button type="button" class="mybutton" onclick="addfiedldName()">Adicionar mais passos</button>
            </div>
            <br><br>
    
            <button type="submit" class="mybutton" onclick="submitForm()">Submeter Exercício</button>
        </form>
    </div>
    <script>
        var mmiCli_1 = null;
        mmiCli_1 = new MMIClient(null, mmi_fusion + "SPEECHIN");

        let stepCount = 0;

        // Exibir campos dinâmicos com base no tipo
        function showFields() {
            const stepsContainer = document.getElementById('stepsContainer');
            const stepFields = document.getElementById('stepFields');

            // Redefinir
            stepFields.innerHTML = '';
            stepCount = 0;

            const tipo = document.getElementById('tipo').value;

            if (tipo) {
                stepsContainer.classList.remove('hidden');

                // Adicionar os primeiros 3 passos para o tipo selecionado
                if (tipo === 'palavras') {
                    addSteps(['Passo', 'Palavra', 'Descrição']);
                } else if (tipo === 'frases') {
                    addSteps(['Passo', 'Frase', 'Descrição']);
                } else if (tipo === 'leitura') {
                    addSteps(['Passo', 'Título', 'Texto', 'Descrição']);
                } else if (tipo === 'discurso') {
                    addSteps(['Passo', 'Pergunta', 'Descrição']);
                } else if (tipo === 'diadococinesia') {
                    addSteps(['Passo', 'Tipo de Consoante', 'Sílabas', 'Descrição']);
                }
            } else {
                stepsContainer.classList.add('hidden');
            }
        }

        function addfiedldName() {
            const stepsContainer = document.getElementById('stepsContainer');
            const stepFields = document.getElementById('stepFields');

            // Redefinir
            //stepFields.innerHTML = '';
            //stepCount = 0;

            const tipo = document.getElementById('tipo').value;

            if (tipo) {
                //stepsContainer.classList.remove('hidden');

                // Adicionar os primeiros 3 passos para o tipo selecionado
                if (tipo === 'palavras') {
                    addSteps(['Passo', 'Palavra', 'Descrição']);
                } else if (tipo === 'frases') {
                    addSteps(['Passo', 'Frase', 'Descrição']);
                } else if (tipo === 'leitura') {
                    addSteps(['Passo', 'Título', 'Texto', 'Descrição']);
                } else if (tipo === 'discurso') {
                    addSteps(['Passo', 'Pergunta', 'Descrição']);
                } else if (tipo === 'diadococinesia') {
                    addSteps(['Passo', 'Tipo de Consoante', 'Sílabas', 'Descrição']);
                }
            } 

        }

        // Adicionar campos dinâmicos
        function addSteps(fieldNames = []) {
            const stepFields = document.getElementById('stepFields');
            stepCount++;
            fieldNames.forEach(name => {
                

                const fieldDiv = document.createElement('div');
                fieldDiv.id = `step-${stepCount}`;

                const fieldLabel = document.createElement('label');
                /*
                if (name.toLowerCase() === 'tipo de consoante') {
                    fieldLabel.innerText = `consoante ${stepCount}: `;
                } else{
                    fieldLabel.innerText = `${name} ${stepCount}: `;
                }
                */
                fieldLabel.innerText = `${name} ${stepCount}: `;
                fieldDiv.appendChild(fieldLabel);

                const fieldInput = document.createElement('input');
                fieldInput.type = name.toLowerCase() === 'passo' ? 'number' : 'text';
                fieldInput.name = `${name.toLowerCase()}-${stepCount}`;
                fieldInput.required = true;
                fieldDiv.appendChild(fieldInput);
                
                stepFields.appendChild(fieldDiv);
            });
        }

        // Submeter formulário
        function submitForm() {
            //event.preventDefault(); // Evitar recarregar a página
            const form = document.getElementById('dynamicForm');
            const formData = new FormData(form);
            let submit = true;

            data = {
                action: "addExercise",
                type: "",
                name: formData.get('name'),
                description: formData.get('description-exercise'),
                userName: formData.get('userName'),
                steps: [],
            };

            // Obter o tipo de exercício selecionado
            if (formData.get('tipo') == "palavras") {
                data.type = "Repetição de Palavras";
            }
            else if (formData.get('tipo') == "frases") {
                data.type = "Repetição de Frases";
            } else if (formData.get('tipo') == "leitura") {
                data.type = "Atividades de Leitura";
            } else if (formData.get('tipo') == "discurso") {
                data.type = "Discurso Espontâneo";
            } else if (formData.get('tipo') == "diadococinesia") {
                data.type = "Diadococinésia";
            }

            const steps = [];
            step = {};
            validate = false;

            // Obter os valores dos campos do formulário
            for (let [key, value] of formData.entries()) {
                if (formData.get('tipo') == "palavras") {
                        key = key.split('-')[0];
                        if (key == "passo") {
                            step.step = value.trim();
                        } else if (key == "palavra") {
                            step.word = value.trim();
                        } else if (key == "descrição") {
                            step.description = value.trim();
                        }
                        if (Object.keys(step).length > 2) {
                            validate = true;
                        }
                        
                } else if (formData.get('tipo') == "frases") { 
                        key = key.split('-')[0];
                        if (key == "passo") {
                            step.step = value.trim();
                        } else if (key == "frase") {
                            step.sentence = value.trim();   
                        } else if (key == "descrição") {
                            step.description = value.trim();
                        }
                        if (Object.keys(step).length > 2) {
                            validate = true;
                        }
                } else if (formData.get('tipo') == "leitura") {
                    key = key.split('-')[0];
                    if (key == "passo") {
                        step.step = value.trim();
                    } else if (key == "title") {
                        step.title = value.trim();
                    } else if (key == "texto") {
                        step.text = value.trim();
                    } else if (key == "descrição") {
                        step.description = value.trim();
                    }
                    if (Object.keys(step).length > 3) {
                        validate = true;
                    }
                } else if (formData.get('tipo') == "discurso") {
                    key = key.split('-')[0];
                    if (key == "passo") {
                        step.step = value.trim();
                    } else if (key == "pergunta") {
                        step.question = value.trim();
                    } else if (key == "descrição") {
                        step.description = value.trim();
                    }
                    if (Object.keys(step).length > 2) {
                        validate = true;
                    }
                } else if (formData.get('tipo') == "diadococinesia") {
                    key = key.split('-')[0];
                    if (key == "passo") {
                        step.step = value.trim();
                    } else if (key.split(" ")[2] == "consoante") {
                        step.typeOfConsonant = value.trim();
                    } else if (key == "sílabas") {
                        step.syllables = value.trim();
                    } else if (key == "descrição") {
                        step.description = value.trim();
                    }

                    if (Object.keys(step).length > 3) {
                        validate = true;
                    }
                }

                if (validate) {
                    steps.push(step);
                    step = {};
                    validate = false;
                }

                // Verificar se algum campo está vazio ou se o tipo não foi selecionado
                if (value == "" || formData.get('tipo') == "select..." || formData.get('tipo') == "selecione...") {
                    alert('Por favor, preencha todos os campos antes de submeter.');
                    submit = false;
                    return false;
                }

            }
            
            //alert(`Exercício Submetido:\n${steps.map((step, index) => `Passo ${index + 1}: ${JSON.stringify(step)}`).join('\n')}`);
            if (submit) {
                data.steps = steps;
                sendData(data);
            }
        }

        // Enviar dados para o IM
        function sendData(data) {
            var message = {'intent':data.action,'message':"Submeter novo Exercicio"};
            var result = { "recognized" : ["SPEECH", "SPEECHIN", "APP"], "data": data, "nlu": message };
            mmiCli_1.sendToIM(new LifeCycleEvent("SPEECHIN", "IM", "text-1", "ctx-1").
                    doExtensionNotification(new EMMA("text-", "text", "command", 1, 0).
                    setValue(JSON.stringify(result))));
            
            console.log("Dados do exercício enviados!");
            alert("Exercício submetido com sucesso!");
        }

    </script>
