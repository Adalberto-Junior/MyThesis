      function printData(texto) {
        const exibirTexto = document.getElementById("exibir-texto");

        // Marcar mensagens antigas como lidas (verdes)
        const mensagensAntigas = exibirTexto.querySelectorAll('.mensagem');
        mensagensAntigas.forEach(msg => msg.classList.add('lido'));

        const segmentos = texto.split("BR.").map(s => s.trim()).filter(Boolean);

        let blocos = [];

        segmentos.forEach(segmento => {
          if (segmento.startsWith("PG.")) {
            const conteudo = segmento.replace("PG.", "").trim();
            blocos.push({ tipo: "pg", html: `<p class="mensagem"><span style="color: orange;">🔸</span> ${conteudo}</p>` });
          } else {
            // Elemento indentado com marcador •
            blocos.push({
              tipo: "indentado",
              html: `<p class="mensagem" style="margin-left: 40px;"><span style="color: #555;">•</span> ${segmento}</p>`
            });
          }
        });

        // Construção do HTML final preservando a ordem
        let newParagraph = blocos.map(bloco => bloco.html).join("");

        // Se nenhum marcador especial, mostrar como parágrafo simples
        if (!texto.includes("BR.") && !texto.includes("PG.")) {
          newParagraph = `<p class="mensagem">${texto}</p>`;
        }

        // Apresentar no DOM
        exibirTexto.innerHTML += newParagraph;

        // Atualizar localStorage
        const mensagensAtuais = localStorage.getItem("mensagens") || "";
        localStorage.setItem("mensagens", mensagensAtuais + newParagraph);

        // Scroll automático
        exibirTexto.scrollTop = exibirTexto.scrollHeight;
      }

      /**
 * printData(texto, media, options)
 * - texto: string (usa BR. e PG. como antes)
 * - media: { imagens: [path], audios: [path], videos: [path] } (opcional)
 * - options: { baseUrl: 'https://meudominio.com' } (opcional)
 */
function printDataV1(texto, media = {}, options = {}) {
    const exibirTexto = document.getElementById("exibir-texto");
    if (!exibirTexto) return;

    // Marca mensagens antigas como lidas
    const mensagensAntigas = exibirTexto.querySelectorAll(".mensagem");
    mensagensAntigas.forEach((msg) => msg.classList.add("lido"));

    const baseUrl = options.baseUrl || (typeof window !== "undefined" && window.location ? window.location.origin : "");

    // Helper: constroi URL absoluta de forma segura
    function buildAbsoluteUrl(path) {
      if (!path) return null;
      // Se já é absoluta (http/https) retorna direto
      try {
        const maybe = new URL(path, baseUrl || undefined);
        return maybe.toString();
      } catch (e) {
        // fallback: concatena e faz encode
        const clean = path.replace(/^\/+/, "");
        return (baseUrl || "") .replace(/\/+$/, "") + "/" + encodeURI(clean);
      }
    }

    // Helper: criar parágrafo com icon + texto (protegendo contra XSS)
    function createTextNodeBlock(text, { icon = "•", color = "#555", indent = false } = {}) {
      const p = document.createElement("p");
      p.className = "mensagem";
      if (indent) p.style.marginLeft = "40px";

      if (icon) {
        const spanIcon = document.createElement("span");
        spanIcon.textContent = icon + " ";
        spanIcon.style.color = color;
        spanIcon.style.marginRight = "6px";
        p.appendChild(spanIcon);
      }

      p.appendChild(document.createTextNode(text));
      return p;
    }

    // Parse texto (BR. / PG.)
    const segmentos = (texto || "").split("BR.").map(s => s.trim()).filter(Boolean);
    if (segmentos.length === 0 && texto) {
      // texto vazio dividido — só insere o texto original
      exibirTexto.appendChild(createTextNodeBlock(texto, { icon: null }));
    } else {
      segmentos.forEach(segmento => {
        if (segmento.startsWith("PG.")) {
          const conteudo = segmento.replace("PG.", "").trim();
          exibirTexto.appendChild(createTextNodeBlock(conteudo, { icon: "🔸", color: "orange", indent: false }));
        } else {
          exibirTexto.appendChild(createTextNodeBlock(segmento, { icon: "•", color: "#555", indent: true }));
        }
      });
    }

    // ==== MEDIA ====
    // função para adicionar elemento wrapper (mensagem)
    function appendWrapperElement(el) {
      const wrapper = document.createElement("div");
      wrapper.className = "mensagem";
      wrapper.style.marginTop = "6px";
      wrapper.appendChild(el);
      exibirTexto.appendChild(wrapper);
      return wrapper;
    }

    if (media && typeof media === "object") {
      // Imagens
      if (Array.isArray(media.imagens) && media.imagens.length > 0) {
        media.imagens.forEach((imgPath) => {
          const src = buildAbsoluteUrl(imgPath);
          if (!src) return;
          const img = document.createElement("img");
          img.src = src;
          img.alt = "imagem";
          img.style.maxWidth = "360px";
          img.style.borderRadius = "8px";
          img.style.display = "block";
          img.style.margin = "6px 0";
          appendWrapperElement(img);
        });
      }

      // Áudios (tenta autoplay; se rejeitado, mostra botão de play)
      if (Array.isArray(media.audios) && media.audios.length > 0) {
        media.audios.forEach((audioPath) => {
          const src = buildAbsoluteUrl(audioPath);
          if (!src) return;
          const audio = document.createElement("audio");
          audio.src = src;
          audio.controls = true;
          audio.preload = "auto";
          audio.style.margin = "6px 0";
          const wrapper = appendWrapperElement(audio);

          // tenta reproduzir automaticamente (pode ser bloqueado)
          const p = audio.play?.();
          if (p && typeof p.then === "function") {
            p.catch(() => {
              // autoplay bloqueado — mostra botão para tocar
              const btn = document.createElement("button");
              btn.textContent = "▶️ Tocar áudio";
              btn.className = "btn-play-audio";
              btn.style.marginLeft = "8px";
              btn.onclick = () => {
                audio.play().catch(err => console.error("Erro ao reproduzir:", err));
                btn.remove();
              };
              wrapper.appendChild(btn);
            });
          }
        });
      }

      // Vídeos (muted=true para permitir autoplay; adicionar botão para ativar som)
      if (Array.isArray(media.videos) && media.videos.length > 0) {
        media.videos.forEach((videoPath) => {
          const src = buildAbsoluteUrl(videoPath);
          if (!src) return;
          const video = document.createElement("video");
          video.src = src;
          video.controls = true;
          video.preload = "metadata";
          video.muted = true; // permite autoplay em muitos browsers
          video.playsInline = true;
          video.style.maxWidth = "360px";
          video.style.borderRadius = "8px";
          video.style.display = "block";
          video.style.margin = "6px 0";
          const wrapper = appendWrapperElement(video);

          // tenta autoplay (pode ser bloqueado)
          const p = video.play?.();
          if (p && typeof p.then === "function") {
            p.catch(() => {
              // autoplay bloqueado — oferece botão para iniciar
              const btn = document.createElement("button");
              btn.textContent = "▶️ Reproduzir vídeo";
              btn.className = "btn-play-video";
              btn.style.marginLeft = "8px";
              btn.onclick = () => {
                // ao clicar, desmutar opcionalmente
                video.muted = false;
                video.play().catch(err => console.error("Erro ao reproduzir vídeo:", err));
                btn.remove();
              };
              wrapper.appendChild(btn);
            });
          } else {
            // autoplay aconteceu: se quiseres ativar som automaticamente (não recomendado),
            // podes tentar desmutar depois de user gesture.
          }
        });
      }
    }

    // Salva snapshot em localStorage (string HTML). Avisa: só faça isto se confiares na origem.
    try {
      localStorage.setItem("mensagens", exibirTexto.innerHTML);
    } catch (e) {
      console.warn("Não foi possível salvar mensagens no localStorage:", e);
    }

    // scroll automático
    exibirTexto.scrollTop = exibirTexto.scrollHeight;
  }

      function mostrarMenu(menu) {
        const exibirTexto = document.getElementById("exibir-texto");

        // Marcar mensagens antigas como lidas (verdes)
        const mensagensAntigas = exibirTexto.querySelectorAll('.mensagem');
        mensagensAntigas.forEach(msg => msg.classList.add('lido'));

        let output = `<div class="mensagem"><strong>Menu:</strong><br><br>`;

        let contador = 1;

        for (let key in menu) {
            const valor = menu[key].trim();
            const [titulo, ...resto] = valor.split(':');
            const frases = resto.join(':').split("BR.").map(f => f.trim()).filter(Boolean);

            output += `<p><strong>${contador}. ${titulo.trim()}:</strong></p>`;
            output += `<ul>` + frases.map(frase => `<li>${frase}</li>`).join('') + `</ul>`;
            contador++;
        }

        output += `</div>`;

        // Adiciona ao DOM
        exibirTexto.innerHTML += output;

        // Atualiza localStorage
        const mensagensAtuais = localStorage.getItem("mensagens") || "";
        localStorage.setItem("mensagens", mensagensAtuais + output);

        // Scroll automático
        exibirTexto.scrollTop = exibirTexto.scrollHeight;
      }
