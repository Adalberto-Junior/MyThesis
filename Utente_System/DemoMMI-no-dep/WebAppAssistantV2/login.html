<!DOCTYPE html>
<html lang="pt">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Formulário de Login</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #f2f2f2;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 90vh;
            }
            .container {
                background-color: #fff;
                padding: 20px;
                border-radius: 8px;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            }
            .container h2 {
                margin-bottom: 20px;
            }
            .container input[type="text"],
            .container input[type="email"],
            .container input[type="password"] {
                width: 99%;
                padding: 10px;
                margin-left: 10px;
                margin: 5px 0 20px 0;
                border: 1px solid #ccc;
                border-radius: 4px;
            }
            .container input[type="submit"] {
                background-color: #4CAF50;
                color: white;
                padding: 10px 20px;
                border: none;
                border-radius: 4px;
                cursor: pointer;
            }
            .container input[type="submit"]:hover {
                background-color: #45a049;
            }
            .myDiv {
                border: 0px outset beige;
                background-color: lavender;    
                text-align: center;
                width: 99%;
                height: 40px;
                position: absolute;
                top: 0;
                display: flex;
                justify-content: center;
                align-items: center;
                border-radius: 8px;
            }
        </style>
    </head>
    <body>
        <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@latest/dist/svg.min.js"></script>
        <script src="js/mmi.js"></script>
        <script src="js/globals.js"></script>
        <script src="js/jquery-3.6.4.min.js"></script>
        <script src="js/webtoolkit.utf8.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
        <div class="myDiv">Casa Viva</div>

        <div class="container">
            <h2>Login</h2>
            <form action="/login" method="post">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="password">Palavra-passe:</label>
                <input type="password" id="password" name="password" required>

            <button type="submit" style="color: white; background-color: #4CAF50; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer;"
            onclick="validateForm(event)">Entrar</button>
            </form>
            <p>Não tem conta? <a href="registro.html">Registre-se aqui</a></p>
            <!-- <p>Esqueceu a senha? <a href="recuperarSenha.html">Recuperar senha</a></p> -->
        </div>
        <script>  
            var mmiCli_1 = new MMIClient(null, mmi_fusion + "SPEECHIN");

            // WebSocket para escutar resposta do login
            var mmiCli_Out_add = "wss://" + host + ":8005/IM/USER1/";
            var mmiCli_Out = new MMIClientSocket(mmiCli_Out_add + "GRAPHICS");
            mmiCli_Out.onMessage.on(imLoginMessageHandler);
            mmiCli_Out.onOpen.on(() => {
                if (mmiCli_Out.socket.readyState !== WebSocket.OPEN) return;
                console.log("Socket de login aberto!");
            });
            mmiCli_Out.openSocket();

            const loginButton = document.querySelector("button[type='submit']");

            function validateForm(event) {
                event.preventDefault();

                const email = document.getElementById("email").value.trim();
                const password = document.getElementById("password").value.trim();

                if (email === '' || password === '') {
                    alert('Por favor, preencha todos os campos para fazer o login.');
                    return false;
                }

                // Desativar botão e mostrar loading
                loginButton.disabled = true;
                loginButton.textContent = "Entrando...";

                sendLoginData(email, password);
            }

            function sendLoginData(email, password) {
                const data = {
                    action: "login",
                    email: email.toLowerCase(),
                    password: password
                };

                const message = { intent: data.action, message: "Login do user" };
                const result = {
                    recognized: ["SPEECH", "SPEECHIN", "APP"],
                    data: data,
                    nlu: message
                };

                mmiCli_1.sendToIM(
                    new LifeCycleEvent("SPEECHIN", "IM", "text-1", "ctx-1")
                        .doExtensionNotification(
                            new EMMA("text-", "text", "command", 1, 0).setValue(JSON.stringify(result))
                        )
                );

                console.log("Dados de login enviados!");
            }

            function imLoginMessageHandler(data) {
                if (!data || data === "RENEW" || data === "OK") return;

                var content = $(data).find("emma\\:interpretation").first().text().trim();
                if (typeof content === 'string') {
                    try {
                        let parsed = JSON.parse(content);

                        // Verifica se é resposta de login
                        if (parsed?.command === "loginResult") {
                            if (parsed.status === "success") {
                                window.location.href = "appGui.htm";
                            } else {
                                alert("Erro no login: " + (parsed.message || "Credenciais inválidas."));
                                // Reativar botão
                                loginButton.disabled = false;
                                loginButton.textContent = "Entrar";
                            }
                        }
                    } catch (e) {
                        console.error("Erro ao interpretar resposta do login:", e);
                        loginButton.disabled = false;
                        loginButton.textContent = "Entrar";
                    }
                }
            }
        </script>
    </body>
</html>
