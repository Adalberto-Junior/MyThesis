<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Utilizador</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 90vh;
        }
        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 30%;
        }
        .container h2 {
            margin-bottom: 20px;
        }
        .container input[type="text"],
        .container input[type="email"],
        .container input[type="password"] {
            width: 99%;
            padding: 10px;
            margin-left: 10px;
            margin: 5px 0 20px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .container input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .container input[type="submit"]:hover {
            background-color: #45a049;
        }
        .myDiv {
            border: 0px outset beige;
            background-color: lavender;    
            text-align: center;
            width: 99%;
            height: 40px;
            position: absolute;
            top: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
        }
      </style>
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@latest/dist/svg.min.js"></script>
    <script src="js/mmi.js"></script>
    <script src="js/globals.js"></script>
    <script src="js/jquery-3.6.4.min.js"></script>
    <script src="js/webtoolkit.utf8.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <div class="myDiv">Casa Viva</div>
    <div class="container">
      <h2>Registro de Utilizador</h2>

        <form action="/registrar" method="POST">
          <label for="username">Nome de Utilizador:</label><br>
          <input type="text" id="username" name="username" required><br><br>
  
          <label for="age">Idade:</label><br>
          <input type="text" id="age" name="age" required><br><br>
  
          <label for="email">E-mail:</label><br>
          <input type="email" id="email" name="email" required><br><br>
  
          <label for="password">Palavra-passe:</label><br>
          <input type="password" id="password" name="password" required><br><br>
  
          <label for="terapistName">Nome da Terapeuta:</label><br>
          <input type="text" id="terapistName" name="terapistName" required><br><br>
  
          <label for="terapistEmail">Email da Terapeuta:</label><br>
          <input type="email" id="terapistEmail" name="terapistEmail" required><br><br>

          <button type="submit" style="color: white; background-color: #4CAF50; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer;"
          onclick="validateForm(event)">Registrar</button>
      </form>
        <p>Já tem uma conta? <a href="login.html">Entrar</a></p>
    </div>
    
    <script>
       
       var mmiCli_1 = null;
       mmiCli_1 = new MMIClient(null, mmi_fusion + "SPEECHIN");
       function validateForm(event) {
            // Prevent default button behavior
            event.preventDefault();
            
            const username = document.getElementById("username").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();
            const age = document.getElementById("age").value.trim();
            const terapistName = document.getElementById("terapistName").value.trim();
            const terapistEmail = document.getElementById("terapistEmail").value.trim();

            
            if (username === '' || email === '' || password === '' || age == '' || terapistName == '' || terapistEmail == ''  ) {
                alert('Por favor, preencha todos os campos antes de registrar.');
                return false;
            }
            
            sendRegisterData();
        }

        function sendRegisterData() {
            const username = document.getElementById("username").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const age = document.getElementById("age").value;
            const terapistName = document.getElementById("terapistName").value;
            const terapistEmail = document.getElementById("terapistEmail").value;

            const data = {
                action: "register",
                name: username,
                email: email.toLowerCase(),
                password: password,
                age: age,
                therapist: terapistName,
                email_therapist: terapistEmail.toLowerCase()
            };
            //const hashedPassword = CryptoJS.SHA256(password).toString();
            var message = {'intent':data.action,'message':"Registar novo user"}
            var result = { "recognized" : ["SPEECH", "SPEECHIN", "APP"], "data": data, "nlu": message };
            mmiCli_1.sendToIM(new LifeCycleEvent("SPEECHIN", "IM", "text-1", "ctx-1").
                    doExtensionNotification(new EMMA("text-", "text", "command", 1, 0).
                    setValue(JSON.stringify(result))));
            
            console.log("Dados de registro enviados!");
        }

        function sendLoginData() {
            const email = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            const data = {
                action: "login",
                email: email,
                password: password
            };

            var message = {'intent':data.action,'message':"Login do user"}
            var result = { "recognized" : ["SPEECH", "SPEECHIN", "APP"], "data": data, "nlu": message };
            mmiCli_1.sendToIM(new LifeCycleEvent("SPEECHIN", "IM", "text-1", "ctx-1").
                    doExtensionNotification(new EMMA("text-", "text", "command", 1, 0).
                    setValue(JSON.stringify(result))));
            console.log("Dados de login enviados!");
        }

    </script>


</body>
</html>
