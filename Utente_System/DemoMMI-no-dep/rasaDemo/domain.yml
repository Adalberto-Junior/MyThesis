version: '3.1'
intents:
- greet
- goodbye
- affirm
- deny
- communication_skills
- continue_later
- ask_username
- request_change_username
- agradecer
- change_color
- light_switch

entities:
- username
- event
- hour
- switch
- shape
- color
- exercicio


forms:
  form_name:
    required_slots:
      - username

slots:
  username:
    type: text
    initial_value: "Maria"
    influence_conversation: true
    mappings:
      - type: from_text
        conditions:
          - active_loop: form_name
            requested_slot: username


  switch:
    type: text
    influence_conversation: true
    mappings:
    - type: from_entity
      entity: switch
  place:
    type: text
    influence_conversation: true
    mappings:
    - type: from_entity
      entity: place
  shape:
    type: text
    influence_conversation: true
    mappings:
    - type: from_entity
      entity: shape
  color:
    type: text
    influence_conversation: true
    mappings:
    - type: from_entity
      entity: color
  
  exercicio:
    type: text
    influence_conversation: false
    mappings:
    - type: from_entity
      entity: exercicio

responses:
  utter_default:
  - text: Desculpe, não percebi. Pode repetir?
  - text: Desculpe, não percebi. Pode falar um pouco mais alto?
  - text: Desculpe, não percebi. Pode falar mais devagar?
  - text: Desculpe, não percebi. Pode falar mais claramente?
  utter_greet:
  - text: Olá {username}, como posso ajudar? Pode perguntar caso não saiba as funcionalidades disponíveis.
  utter_done:
  - text: Okay! Está marcado {event} às {hour}!
  utter_cancel:
  - text: Okay! Está cancelado!
  utter_goodbye:
  - text: Adeus!
  - text: Lembre-se, estou sempre à sua disposição!
  utter_joke:
  - text: Qual é o contrário de paixão? Mãe teto.
  - text: Por que é que o polícia não usa sabão? Porque prefere deter gente.
  - text: Por que é que o panado se divorciou? Porque a mulher não servia panada.
  - text: Qual é a diferença entre o cavalo e o palhaço? Um gosta de palha crua e o outro de palhaçada.
  - text: Qual é a diferença entre um padre e um Mercedes? O padre reza e o Mercedes Benz
  - text: Qual é o animal mais antigo? A zebra, porque está sempre às riscas.
  utter_start_diagnostics:
  - text: Certo, vamos testar as suas capacidades de comunicação. Fazendo um diagnóstico.
  - text: Estou pronto, avisa quando puderes começar.
  utter_continue_later:
  - text:  Está bem, vou tirar nota de onde paramos e depois continuamos.
  utter_ask_username:
  - text: "Como posso chamar-te?"
  utter_submit:
  - text: "Obrigado {username}!"
  utter_slots_values:
  - text: "Vou guardar o teu nome como {username}"
  utter_agradecer:
  - text: "De nada!"

actions:
- action_greet_user
- utter_goodbye
- action_start_diagnostics
- action_pause_diagnostics
- action_change_name
- action_default_fallback
- action_afirmar
- action_negar
- action_ler_exercicio

#- action_switch_lights

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
